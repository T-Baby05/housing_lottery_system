<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>还房业务平台 - 项目工作台</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="sidebar"></div>
  <div class="main">
    <div class="top-bar"></div>
    <div class="content">
      <div class="hero-section" style="background: linear-gradient(135deg, var(--accent), var(--gold)); color: #fff; padding: 40px; border-radius: var(--radius); margin-bottom: 24px;">
        <h1 style="font-size: 32px; margin-bottom: 12px;">欢迎使用还房业务平台</h1>
        <p style="opacity: 0.9; font-size: 16px;">基于“项目管理”核心逻辑，提供从住户管理到结果发布的全链路还房解决方案。</p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 24px;">
        <div class="card" style="margin-bottom: 0; padding: 20px;">
          <div style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">进行中项目</div>
          <div style="font-size: 28px; font-weight: 700;">1</div>
        </div>
        <div class="card" style="margin-bottom: 0; padding: 20px;">
          <div style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">已完成归档</div>
          <div style="font-size: 28px; font-weight: 700;">1</div>
        </div>
        <div class="card" style="margin-bottom: 0; padding: 20px;">
          <div style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">总涉及住户</div>
          <div style="font-size: 28px; font-weight: 700;">204</div>
        </div>
        <div class="card" style="margin-bottom: 0; padding: 20px;">
          <div style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">待分配房源</div>
          <div style="font-size: 28px; font-weight: 700;">166</div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
        <div class="card">
          <div class="card-title">当前活跃项目概览</div>
          <div id="project-list">
            <!-- Project cards will be rendered here -->
          </div>
        </div>
        <div class="card">
          <div class="card-title">演示操作指南</div>
          <div style="font-size: 14px; line-height: 1.8;">
            <ol style="padding-left: 20px;">
              <li><strong>数据准备</strong>: 在“住户管理”和“房源管理”查看导入的数据。</li>
              <li><strong>审核锁定</strong>: 在“意愿与审核”页面点击“锁定数据”按钮。</li>
              <li><strong>执行摇号</strong>: 进入“摇号控制台”执行 A/B/C/D 四轮摇号。</li>
              <li><strong>发布结果</strong>: 在“通知管理”发布结果，启用手机查询。</li>
              <li><strong>手机模拟</strong>: 访问“住户查询页”模拟手机端查询。</li>
              <li><strong>归档关闭</strong>: 在“结果与归档”页点击“完成归档”。</li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderSidebar('index');
      UI.renderTopBar();

      const project = PrototypeState.getCurrentProject();
      const projectList = document.getElementById('project-list');
      
      projectList.innerHTML = `
        <div style="border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h3 style="margin-bottom: 8px; font-size: 18px;">${project.name}</h3>
            <div style="font-size: 13px; color: var(--muted); display: flex; gap: 16px;">
              <span>📍 ${project.location}</span>
              <span>👥 住户: ${project.totalHouseholds}</span>
              <span>🏢 房源: ${project.totalUnits}</span>
            </div>
            <div style="margin-top: 12px; height: 6px; width: 200px; background: #eee; border-radius: 3px; overflow: hidden;">
              <div style="width: ${project.currentStage * 10}%; height: 100%; background: var(--accent);"></div>
            </div>
            <div style="font-size: 11px; margin-top: 4px; color: var(--accent);">进度: 阶段 ${project.currentStage} / 10</div>
          </div>
          <a href="project-overview.html" class="btn btn-primary">进入项目管理</a>
        </div>
      `;
    });
  </script>
</body>
</html>
