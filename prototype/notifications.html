<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公示与查询 - 还房活动一期原型</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="sidebar"></div>
  <div class="main">
    <div class="top-bar"></div>
    <div class="content">
      <div class="card">
        <div class="card-title">
          <span>规则公示与活动流程公示</span>
        </div>
        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px;">
          <div>
            <div style="font-weight: 700; margin-bottom: 12px;">活动规则摘要</div>
            <div id="rules-list" style="display: grid; gap: 12px;"></div>
          </div>
          <div style="background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 20px;">
            <div style="font-weight: 700; margin-bottom: 12px;">活动日流程公示</div>
            <div id="flow-list" style="display: grid; gap: 12px;"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>查询发布与通知准备</span>
          <button id="publish-btn" class="btn btn-primary" onclick="togglePublish()">发布结果至查询页</button>
        </div>
        <div style="display: flex; gap: 40px; align-items: flex-start;">
          <div style="flex: 1;">
            <p style="font-size: 14px; color: var(--muted); margin-bottom: 20px;">
              本页同时承担两类公示职责：活动开始前用于公示规则和活动流程，活动结束后用于统一发布查询入口和结果通知，避免现场重复解释。
            </p>
            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px dashed var(--line); text-align: center;">
              <div style="width: 120px; height: 120px; background: #eee; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px;">二维码占位</div>
              <div style="font-size: 12px; color: var(--muted);">项目统一规则/查询二维码</div>
            </div>
            <div style="margin-top: 16px; font-size: 13px; color: var(--muted); line-height: 1.7;">
              发布前扫码可查看规则公示和活动日流程；发布后在同一入口查询摇号结果，无需重新更换二维码。
            </div>
          </div>
          <div style="flex: 1; background: var(--paper); padding: 20px; border-radius: 8px; border: 1px solid var(--line);">
            <div style="font-weight: 700; margin-bottom: 12px;">短信通知预览</div>
            <div id="sms-preview" style="font-size: 13px; line-height: 1.6; color: #444;">
              【还房活动】尊敬的{姓名}，{项目名称}摇号活动已结束。请通过统一查询入口查看本人结果及后续办理说明。
            </div>
            <button class="btn btn-secondary" style="margin-top: 16px; width: 100%;" disabled>执行批量短信发送</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">发布状态追踪</div>
        <table style="font-size: 13px;">
          <thead>
            <tr>
              <th>渠道</th>
              <th>状态</th>
              <th>发布时间</th>
              <th>覆盖人数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>手机查询页</td>
              <td><span id="publish-status" class="badge badge-warning">未发布</span></td>
              <td id="publish-time">--</td>
              <td>24 户</td>
              <td><button class="btn btn-secondary" style="padding: 2px 6px; font-size: 11px;">查看日志</button></td>
            </tr>
            <tr>
              <td>短信通知</td>
              <td><span class="badge badge-warning">未发送</span></td>
              <td>--</td>
              <td>0 户</td>
              <td>--</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    function togglePublish() {
      if (!PrototypeState.data.roundExecutionState.D) {
        alert('请先完成所有轮次摇号再发布结果！');
        return;
      }
      PrototypeState.data.publishedState = !PrototypeState.data.publishedState;
      PrototypeState.save();
      location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
      UI.renderSidebar('notifications');
      UI.renderTopBar();

      const isPublished = PrototypeState.data.publishedState;
      const btn = document.getElementById('publish-btn');
      const status = document.getElementById('publish-status');
      const time = document.getElementById('publish-time');
      const project = PrototypeState.getCurrentProject();
      const rulesList = document.getElementById('rules-list');
      const flowList = document.getElementById('flow-list');
      const smsPreview = document.getElementById('sms-preview');

      rulesList.innerHTML = PrototypeState.getPublicRules().map((rule, index) => `
        <div style="border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: #fff;">
          <div style="font-size: 12px; color: var(--muted); margin-bottom: 6px;">规则 ${index + 1}</div>
          <div style="font-size: 14px; line-height: 1.7;">${rule}</div>
        </div>
      `).join('');

      flowList.innerHTML = PrototypeState.getActivityFlow().map(item => `
        <div style="border-left: 3px solid var(--accent); padding-left: 12px;">
          <div style="font-size: 12px; color: var(--muted);">${item.time}</div>
          <div style="font-weight: 700; margin: 4px 0;">${item.title}</div>
          <div style="font-size: 13px; color: var(--muted); line-height: 1.6;">${item.detail}</div>
        </div>
      `).join('');

      smsPreview.textContent = `【还房活动】尊敬的{姓名}，${project.name}摇号活动已结束。请通过统一查询入口查看本人结果及后续办理说明。`;

      if (isPublished) {
        btn.textContent = '撤回发布';
        btn.className = 'btn btn-secondary';
        status.textContent = '已发布';
        status.className = 'badge badge-success';
        time.textContent = '2026-04-12 11:45';
      }
    });
  </script>
</body>
</html>
