spring:
  application:
    name: lottery-server
  datasource:
    url: ${LOTTERY_DB_URL:jdbc:mysql://localhost:3306/housing_lottery?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${LOTTERY_DB_USERNAME:root}
    password: ${LOTTERY_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${LOTTERY_SERVER_PORT:8080}
